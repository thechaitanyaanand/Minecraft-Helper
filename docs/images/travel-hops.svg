<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Travelling to a far or moving target</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#64748b">One long plan times out after 5 s; short hops plan fast and re-aim at the owner every time.</text>

  <!-- before -->
  <text x="40" y="100" font-size="14" font-weight="700" fill="#991b1b">Before: one plan for the whole trip</text>
  <circle cx="80" cy="150" r="14" fill="#f97316"/><text x="80" y="155" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">H</text>
  <circle cx="900" cy="150" r="14" fill="#10b981"/><text x="900" y="155" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">P</text>
  <path d="M96 150 C 250 100, 330 200, 420 150" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#r)"/>
  <text x="440" y="145" font-size="13" fill="#b91c1c">✗ "Took to long to decide path to goal!"</text>
  <text x="440" y="165" font-size="12" fill="#b91c1c">A* exceeds thinkTimeout → goto() rejects → "taking too long, cancelling"</text>

  <!-- after -->
  <text x="40" y="232" font-size="14" font-weight="700" fill="#166534">After: hops of 32 blocks (src/skills/travel.js)</text>
  <circle cx="80" cy="300" r="14" fill="#f97316"/><text x="80" y="305" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">H</text>
  <g stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M96 300 L 262 290"/>
    <path d="M276 290 L 446 305"/>
    <path d="M460 305 L 630 292"/>
    <path d="M644 292 L 780 318"/>
  </g>
  <g fill="#fdba74"><circle cx="270" cy="290" r="6"/><circle cx="454" cy="305" r="6"/><circle cx="638" cy="292" r="6"/></g>
  <circle cx="800" cy="320" r="14" fill="#10b981"/><text x="800" y="325" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">P</text>
  <circle cx="900" cy="300" r="14" fill="none" stroke="#10b981" stroke-dasharray="4 3"/><text x="900" y="305" text-anchor="middle" font-size="11" fill="#10b981">P?</text>
  <text x="850" y="282" text-anchor="middle" font-size="11" fill="#047857">owner moved: next hop re-aims</text>
  <g font-size="12" fill="#334155">
    <text x="40" y="358">• each hop: GoalNearXZ 32 blocks toward the owner's current position (plans in well under 5 s)</text>
    <text x="40" y="378">• a failed hop → retry at 16, then 8 blocks · exact spot unreachable (mid-jump, boat, pillar) → stand beside it · 3 failures → "can't reach you"</text>
  </g>
  <text x="920" y="358" text-anchor="end" font-size="11" fill="#64748b">H = helper, P = player</text>
</svg>
