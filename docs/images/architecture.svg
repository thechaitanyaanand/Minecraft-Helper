<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">System architecture</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#64748b">Everything runs on one Windows PC. Nothing leaves the machine.</text>

  <!-- Windows host frame -->
  <rect x="20" y="80" width="920" height="460" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="36" y="104" font-size="12" font-weight="600" fill="#64748b">WINDOWS 11 HOST</text>

  <!-- Player -->
  <rect x="50" y="130" width="200" height="110" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">Player</text>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#065f46">Minecraft Java 1.20.4</text>
  <text x="150" y="200" text-anchor="middle" font-size="12" fill="#065f46">(TLauncher client)</text>
  <text x="150" y="222" text-anchor="middle" font-size="11" fill="#047857">types "helper get wood"</text>

  <!-- Server -->
  <rect x="380" y="130" width="200" height="110" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Paper server</text>
  <text x="480" y="182" text-anchor="middle" font-size="12" fill="#1e3a8a">1.20.4, offline mode</text>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">127.0.0.1:25565</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#1d4ed8">Java 21 (portable)</text>

  <!-- Bot -->
  <rect x="330" y="300" width="300" height="220" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="480" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Helper bot (Node.js 22)</text>
  <text x="480" y="348" text-anchor="middle" font-size="12" fill="#9a3412">mineflayer + pathfinder + collectblock</text>
  <g font-size="12" fill="#7c2d12">
    <rect x="348" y="362" width="128" height="30" rx="6" fill="#ffedd5"/><text x="412" y="382" text-anchor="middle">chat router</text>
    <rect x="484" y="362" width="128" height="30" rx="6" fill="#ffedd5"/><text x="548" y="382" text-anchor="middle">state builder</text>
    <rect x="348" y="398" width="128" height="30" rx="6" fill="#ffedd5"/><text x="412" y="418" text-anchor="middle">planner + reflexes</text>
    <rect x="484" y="398" width="128" height="30" rx="6" fill="#ffedd5"/><text x="548" y="418" text-anchor="middle">skills</text>
    <rect x="348" y="434" width="128" height="30" rx="6" fill="#ffedd5"/><text x="412" y="454" text-anchor="middle">buddy + observer</text>
    <rect x="484" y="434" width="128" height="30" rx="6" fill="#ffedd5"/><text x="548" y="454" text-anchor="middle">talk + memory</text>
    <rect x="348" y="470" width="264" height="30" rx="6" fill="#ffedd5"/><text x="480" y="490" text-anchor="middle">decision adapter (local | mock | jev)</text>
  </g>

  <!-- Decider -->
  <rect x="710" y="300" width="210" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="815" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#4c1d95">Decider</text>
  <text x="815" y="350" text-anchor="middle" font-size="12" fill="#5b21b6">Mapika/decider-2b</text>
  <text x="815" y="368" text-anchor="middle" font-size="12" fill="#5b21b6">WSL2 Debian, CUDA</text>
  <text x="815" y="386" text-anchor="middle" font-size="12" fill="#5b21b6">POST /v1/systemone</text>
  <text x="815" y="404" text-anchor="middle" font-size="12" fill="#5b21b6">127.0.0.1:8000</text>
  <text x="815" y="426" text-anchor="middle" font-size="11" fill="#6d28d9">~185 ms per decision</text>

  <!-- Live view -->
  <rect x="50" y="330" width="200" height="110" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Live view</text>
  <text x="150" y="382" text-anchor="middle" font-size="12" fill="#075985">browser dashboard</text>
  <text x="150" y="400" text-anchor="middle" font-size="12" fill="#075985">127.0.0.1:3000</text>
  <text x="150" y="422" text-anchor="middle" font-size="11" fill="#0369a1">vitals, map, decisions</text>

  <!-- Memory file -->
  <rect x="710" y="460" width="210" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="815" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">bot/memory.json</text>
  <text x="815" y="505" text-anchor="middle" font-size="11" fill="#475569">home, chests, notes, events</text>

  <!-- arrows -->
  <line x1="250" y1="185" x2="376" y2="185" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="313" y="176" text-anchor="middle" font-size="11" fill="#475569">game protocol</text>
  <line x1="480" y1="240" x2="480" y2="296" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="488" y="272" font-size="11" fill="#475569">game protocol (bot is a player)</text>
  <line x1="630" y1="370" x2="706" y2="370" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="668" y="362" text-anchor="middle" font-size="11" fill="#475569">HTTP JSON</text>
  <line x1="326" y1="385" x2="254" y2="385" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11" fill="#475569">SSE</text>
  <line x1="630" y1="490" x2="706" y2="490" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="668" y="482" text-anchor="middle" font-size="11" fill="#475569">read/write</text>
</svg>
